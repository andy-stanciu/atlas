[project]
name = "atlas-tool-server"
version = "0.1.0"
description = "Atlas tools and automation runtime"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0,<4.0",
    "pytest>=9.1.1",
    "speechbrain>=1.1.0",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.15.0",
    "tzdata>=2024.1",
]
[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
