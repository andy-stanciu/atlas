# Recorder firmware: streams both XVF3800 channels to recorder/capture_server.py on the Mac.
# Keeps the satellite's device name so you can OTA between firmwares without changing anything:
#   record:    cd wakeword/recorder && esphome run atlas-recorder.yaml
#   restore:   cd src/satellite     && esphome run atlas-satellite.yaml
# secrets.yaml: symlink it, `ln -s ../../src/satellite/secrets.yaml secrets.yaml`

esphome:
  name: atlas-sat-1
  friendly_name: Atlas Recorder

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

network:
  enable_high_performance: true

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    i2s_audio: WARN
    respeaker_xvf3800: INFO

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  post_connect_roaming: false

external_components:
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: respeaker_microphone
    components: [i2s_audio]
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
      ref: main
    components: [respeaker_xvf3800, aic3104]
  - source:
      type: local
      path: components

i2c:
  id: internal_i2c
  sda: GPIO5
  scl: GPIO6
  scan: true
  frequency: 100kHz

i2s_audio:
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    update_interval: 1s
  firmware:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration/raw/refs/heads/main/application_xvf3800_inthost-lr48-sqr-i2c-v1.0.7-release.bin
    version: "1.0.7"
    md5: 043a848f544ff2c7265ac19685daf5de

atlas_capture:
  id: cap
  host: "192.168.1.76"
  port: 8766
  microphone_id: i2s_mics
  respeaker_id: respeaker
  log_stats: true
